<div class="container">
  <h2 class="text-center mt-4">Tourism Word Puzzle Game</h2>
  <div class="game-section text-center">

    <p>Form a correct tourism sentence from these words:</p>

    <!-- Word buttons -->
    <div id="wordButtons" class="mb-3"></div>

    <!-- Sentence area -->
    <div class="mb-3">
      <h4>Your Sentence:</h4>
      <div id="sentenceArea" class="border border-light p-2 rounded bg-secondary"></div>
    </div>

    <!-- Buttons -->
    <button class="btn btn-success mb-2" onclick="checkSentence()">Check Answer</button>
    <button class="btn btn-danger mb-2" onclick="resetGame()">Reset</button>

    <!-- Result -->
    <div id="result" class="mt-3 fs-4"></div>

<!-- JavaScript Code -->
<script>
   /*
    
    - 'correctSentence' holds the target sentence to form.
    - 'words' array holds shuffled words that the user can click.
    - 'displayWords()' creates buttons dynamically for each word.
    - 'addWord(word)' updates the sentence area with the selected word.
    - 'checkSentence()' compares the user-formed sentence with the correct one.
    - 'resetGame()' clears everything and reshuffles words to start fresh.
  */
  // Define the correct sentence
  const correctSentence = "Visit beautiful Oman today";

  // Define the words for the puzzle
  const words = ["beautiful", "today", "Oman", "Visit"];

  // This array will store the words selected by the user
  let userSentence = [];

  // Function to display the word buttons dynamically
  function displayWords() {
    const wordButtonsDiv = document.getElementById('wordButtons');
    wordButtonsDiv.innerHTML = "";

    // Shuffle the words randomly
    const shuffledWords = [...words].sort(() => 0.5 - Math.random());

    shuffledWords.forEach(word => {
      const btn = document.createElement('button');
      btn.textContent = word;
      btn.className = "btn btn-light word-button";
      btn.onclick = function() {
        addWord(word);
        btn.disabled = true; // disable word after choosing
      };
      wordButtonsDiv.appendChild(btn);
    });
  }

  // Function to add a selected word to the user's sentence
  function addWord(word) {
    userSentence.push(word);
    document.getElementById('sentenceArea').innerText = userSentence.join(" ");
  }

  // Function to check if the formed sentence is correct
  function checkSentence() {
    const finalSentence = userSentence.join(" ");
    if (finalSentence === correctSentence) {
      document.getElementById('result').innerHTML = "<span class='text-success'>Excellent! You made the correct sentence! :) </span>";
    } else {
      document.getElementById('result').innerHTML = "<span class='text-danger'>Oops! Try again! :( </span>";
    }
  }

  // Function to reset the game
  function resetGame() {
    userSentence = [];
    document.getElementById('sentenceArea').innerText = "";
    document.getElementById('result').innerText = "";
    displayWords();
  }

  // Call the displayWords function initially to set up the game
  displayWords();

 
</script>
