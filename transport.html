<!DOCTYPE html>
<html>
<head>
  <title>Rihla - Transportation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-secondary text-white">
  <img src="logo.jfif" alt="rihla logo"  class="rounded-circle float-end " width="110px">
  
  <div class="bg-light text-dark py-3">
    <div class="row">
      <div class="col-5"></div>
      <div class="col-4 ">
        <h1 id="home-title">Rihla - Explore Oman</h1>
      </div>
      <div class="col-3"></div>
    </div>

    <div class="row text-center">
      <div class="col-2"></div>
      <div class="col"> <a href="index.html" class="text-decoration-none">Home</a></div>
      <div class="col"> <a href="booking.html" class="text-decoration-none">Booking</a></div>
      <div class="col"> <a href="calculator.html" class="text-decoration-none">Calculate</a></div>
      <div class="col"> <a href="markets.html" class="text-decoration-none">Traditional Souqs</a></div>
      <div class="col"> <a href="add_activity.html" class="text-decoration-none">Add Activity</a></div>
      <div class="col"> <a href="funpage.html" class="text-decoration-none">Puzzle</a></div>
      <div class="col"> <a href="review.html" class="text-decoration-none">Review</a></div>
      <div class="col"> <a href="questionnaire.html" class="text-decoration-none">Questionnaire</a></div>
      <div class="col"> <a href="about.html" class="text-decoration-none">About us</a></div>
      <div class="col"> <a href="contact.html" class="text-decoration-none">Contact us</a></div>
      <div class="col-2"></div>
    </div>
  </div>

  <br><br>

  <div class="container mt-4">
    <h2 class="text-center text-white">Transportation Options</h2>

    <!-- Table to display transportation data -->
    <table class="table table-bordered table-hover text-center mt-4 bg-light">
      <thead class="table-primary text-dark">
        <tr>
          <th>Type</th>
          <th>City</th>
          <th>Estimated Cost (OMR)</th>
        </tr>
      </thead>
      <tbody id="transportTable"></tbody>
    </table>

    <!-- Form to add transportation -->
    <div class="bg-light p-4 rounded">
      <h4 class="text-dark">Add New Transportation Option</h4>
      <form id="transportForm">
        <div class="row g-2">
          <div class="col-md-4">
            <input type="text" id="type" placeholder="Type" class="form-control" required>
          </div>
          <div class="col-md-4">
            <input type="text" id="city" placeholder="City" class="form-control" required>
          </div>
          <div class="col-md-4">
            <input type="number" step="0.01" min="0" id="cost" placeholder="Estimated Cost" class="form-control" required>
          </div>
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Add Transportation</button>
        </div>
      </form>
    </div>

    <!-- Search form -->
    <div class="bg-light p-4 rounded mt-4">
      <h4 class="text-dark">Search Transportation</h4>
      <input type="text" id="searchInput" class="form-control mb-2" placeholder="Enter Type or City">
      <button class="btn btn-success" id="searchButton">Search</button>
      <div class="table-responsive mt-3">
        <table class="table table-bordered table-hover text-center bg-light">
          <thead class="table-success text-dark">
            <tr>
              <th>Type</th>
              <th>City</th>
              <th>Estimated Cost (OMR)</th>
            </tr>
          </thead>
          <tbody id="searchTable"></tbody>
        </table>
        <div id="noResults" class="text-white text-center"></div>
      </div>
    </div>
  </div>

  <script>
    function Transport(type, city, cost) {
      this.type = type;
      this.city = city;
      this.cost = parseFloat(cost).toFixed(2);
    }

    let transports = [
      new Transport("Taxi", "Muscat", 3),
      new Transport("Taxi", "Salalah", 10),
      new Transport("Public Bus", "All Major Cities", 1),
      new Transport("Car Rental", "Airports and Hotels", 15)
    ];

    function displayTransport() {
      const table = document.getElementById("transportTable");
      table.innerHTML = "";
      transports.forEach(item => {
        table.innerHTML += `<tr><td>${item.type}</td><td>${item.city}</td><td>OMR ${item.cost}</td></tr>`;
      });
    }

    document.getElementById("transportForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const type = document.getElementById("type").value;
      const city = document.getElementById("city").value;
      const cost = document.getElementById("cost").value;
      if (!isNaN(cost) && cost > 0) {
        transports.push(new Transport(type, city, cost));
        displayTransport();
        this.reset();
      } else {
        alert("Please enter a valid cost.");
      }
    });

    document.getElementById("searchButton").addEventListener("click", function () {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const results = transports.filter(t =>
        t.type.toLowerCase().includes(keyword) ||
        t.city.toLowerCase().includes(keyword)
      );

      const searchTable = document.getElementById("searchTable");
      const noResults = document.getElementById("noResults");

      searchTable.innerHTML = "";
      noResults.innerHTML = "";

      if (results.length > 0) {
        results.forEach(r => {
          searchTable.innerHTML += `<tr><td>${r.type}</td><td>${r.city}</td><td>OMR ${r.cost}</td></tr>`;
        });
      } else {
        noResults.innerHTML = "No matching transportation found.";
      }
    });

    displayTransport();
  </script>
</body>
</html>
