      <div class="row">
        <div class="col-5"></div>
        <div class="col-4 ">
          <h1 id="home-title">Rihla - Explore Oman</h1>
        </div>
        <div class="col-3"></div>
      </div>
  
      <div class="row text-center">
        <div class="col-2"></div>
        <div class="col"> <a href="index.html" class="text-decoration-none">Home</a></div>
        <div class="col"> <a href="booking.html" class="text-decoration-none">Booking</a></div>
        <div class="col"> <a href="transport.html" class="text-decoration-none">Transportation</a></div>
        
        <div class="col"> <a href="add_activity.html" class="text-decoration-none">Add Activity</a></div>
        <div class="col"> <a href="funpage.html" class="text-decoration-none">Puzzle</a></div>

<!-- Main -->
<div class="container">
  <h2 class="text-center mt-4">Calculate Your Total Booking Cost</h2>
  <form id="billForm" class="form-section">

    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Full Name:</label>
      <input type="text" id="name" class="form-control" required>
    </div>

    <!-- Age -->
    <div class="mb-3">
      <label for="age" class="form-label">Your Age:</label>
      <input type="number" id="age" class="form-control" required>
    </div>

    <!-- Services -->
    <div class="mb-3">
      <label class="form-label">Select Services:</label><br>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="wadiShab" value="5">
        <label class="form-check-label" for="wadiShab">Wadi Shab Hiking - 5 OMR</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="nizwaFort" value="3">
        <label class="form-check-label" for="nizwaFort">Nizwa Fort Visit - 3 OMR</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="surDhow" value="2">
        <label class="form-check-label" for="surDhow">Sur Dhow Factory Tour - 2 OMR</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="jebelAkhdar" value="10">
        <label class="form-check-label" for="jebelAkhdar">Jebel Akhdar Adventure - 10 OMR</label>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="d-grid gap-2">
      <button type="button" class="btn btn-primary" onclick="calculateBill()">Calculate Total</button>
    </div>

    <!-- Result Display -->
    <div id="result" class="mt-4 text-center fs-4"></div>

  </form>
</div>

<!-- Footer -->
<div class="row mt-4">
  <div class="col text-center">
    <p>&copy; 2025 Rihla. All rights reserved.</p>
  </div>
</div>

<!-- JavaScript Code -->
<script>
    /*
    1. `calculateBill()` is triggered when the user clicks the button.
    2. It collects selected activities and sums their prices.
    3. If the customer's age is more than 60, a 10% discount is applied.
    4. If the total after discount is more than 15 OMR, they win a free souvenir.
    5. The final message is displayed in the "result" div.
  */
 
  function calculateBill() {
    // Get user input values
    const age = parseInt(document.getElementById('age').value);
    const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
   
    // Sum the prices of selected services
    let total = 0;
    checkboxes.forEach(item => {
      total += parseFloat(item.value);
    });

    // Check if user qualifies for elderly discount (Age > 60)
    if (age > 60) {
      total *= 0.9; // 10% discount
    }

    // Check for free additional gift if total exceeds 15 OMR
    let message = `Total Amount Payable: ${total.toFixed(2)} OMR`;
    

    // Display the result
    document.getElementById('result').innerHTML = message;
  }


</script>

</body>
